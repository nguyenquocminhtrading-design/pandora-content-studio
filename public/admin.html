<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zalo Bot Admin</title><style>body{font:14px system-ui;margin:0;background:#f5f7fb;color:#182230}header{background:#155eef;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}main{max-width:1100px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0001}input,textarea,button{padding:10px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#155eef;color:white;border:0;border-radius:6px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}</style></head><body><header><b>Zalo Bot Admin</b><span id="status">Chưa đăng nhập</span></header><main><section class="card" id="login"><h2>Đăng nhập</h2><input id="key" type="password" placeholder="ADMIN_API_KEY"><button onclick="login()">Đăng nhập</button></section><section id="app" hidden><div class="grid"><div class="card"><h3>Products</h3><div id="products">Đang tải...</div><input id="pname" placeholder="Tên sản phẩm"><input id="pprice" placeholder="Giá"><textarea id="pdesc" placeholder="Mô tả"></textarea><button onclick="addProduct()">Thêm sản phẩm</button></div><div class="card"><h3>FAQs</h3><div id="faqs">Đang tải...</div><input id="fq" placeholder="Câu hỏi"><textarea id="fa" placeholder="Câu trả lời"></textarea><button onclick="addFaq()">Thêm FAQ</button></div><div class="card"><h3>Analytics</h3><pre id="analytics">Đang tải...</pre></div></div></section></main><script>let token='';const api=(p,o={})=>fetch('/api/admin'+p,{...o,headers:{'content-type':'application/json',authorization:'Bearer '+token}}).then(r=>r.json());async function login(){token=document.getElementById('key').value;let r=await api('/products');if(r.error)return alert('Sai key hoặc database chưa sẵn sàng');document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;document.getElementById('status').textContent='Đã đăng nhập';load()}async function load(){let [p,f,a]=await Promise.all([api('/products'),api('/faqs'),api('/analytics')]);products.innerHTML=p.map(x=>'<p><b>'+x.name+'</b> — '+x.price+'</p>').join('')||'Chưa có';faqs.innerHTML=f.map(x=>'<p><b>'+x.question+'</b><br>'+x.answer+'</p>').join('')||'Chưa có';analytics.textContent=JSON.stringify(a,null,2)}async function addProduct(){await api('/products',{method:'POST',body:JSON.stringify({name:pname.value,price:pprice.value,description:pdesc.value})});load()}async function addFaq(){await api('/faqs',{method:'POST',body:JSON.stringify({question:fq.value,answer:fa.value})});load()}</script></body></html>
